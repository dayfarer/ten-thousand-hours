<title>Scale Studies Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#FCFCFA; --panel:#F4F5F1; --ink:#1A1A1C; --ink-2:#55585A; --ink-3:#8A8E8B;
    --rule:#DCDED8; --hair:#EAEBE6; --pencil:#B3231F; --saved:#2F6B4F; --focus:#2A5FA8;
    --sans:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
    --serif:"Source Serif 4",Georgia,serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#16181A; --panel:#1D2023; --ink:#E9E9E4; --ink-2:#A8ADAA; --ink-3:#717673;
    --rule:#2D3135; --hair:#24282B; --pencil:#FF6B5E; --saved:#67C79A; --focus:#7FB0FF;
  }}
  :root[data-theme="dark"]{
    --paper:#16181A; --panel:#1D2023; --ink:#E9E9E4; --ink-2:#A8ADAA; --ink-3:#717673;
    --rule:#2D3135; --hair:#24282B; --pencil:#FF6B5E; --saved:#67C79A; --focus:#7FB0FF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);
       font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  header{border-bottom:2px solid var(--ink);padding-block:26px 14px;margin-bottom:0}
  .eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
           color:var(--ink-3);margin:0 0 6px}
  h1{font-family:var(--sans);font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;
     letter-spacing:-.01em;text-wrap:balance}
  .sub{color:var(--ink-2);margin:8px 0 0;max-width:62ch;font-size:15px}
  .meter{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font-family:var(--sans);
         font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .meter b{font-family:var(--mono);font-size:13px;letter-spacing:0;color:var(--ink);
           font-variant-numeric:tabular-nums;font-weight:500}
  .meter .warn b{color:var(--pencil)}

  .cols{display:grid;grid-template-columns:190px minmax(0,1fr);gap:34px;align-items:start;
        padding-block:26px 80px}
  nav{position:sticky;top:14px;max-height:calc(100svh - 28px);overflow-y:auto}
  nav ol{list-style:none;margin:0;padding:0}
  nav a{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
        font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;text-decoration:none;
        color:var(--ink-2);padding:5px 0;border-bottom:1px solid var(--hair)}
  nav a:hover,nav a:focus-visible{color:var(--ink)}
  nav a .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  nav a.has-blank .n{color:var(--pencil)}

  section{margin-bottom:34px;scroll-margin-top:14px}
  .sh{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--ink);
      padding-bottom:5px;margin-bottom:2px}
  .sh h2{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.11em;
         text-transform:uppercase;margin:0}
  .sh .id{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}

  .row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start;
       padding:9px 0 9px 10px;border-bottom:1px solid var(--hair);border-left:2px solid transparent}
  .row.blank{border-left-color:var(--pencil)}
  .row.dirty{border-left-color:var(--saved)}
  .lab{padding-top:5px}
  .lab .t{font-family:var(--sans);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
          color:var(--ink);display:block}
  .lab .p{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);word-break:break-all}
  .lab .todo{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--pencil);display:block;margin-top:2px}

  .fieldwrap{display:flex;gap:8px;align-items:flex-start}
  textarea,input[type=text]{flex:1;min-width:0;font-family:var(--serif);font-size:15px;line-height:1.45;
    color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:2px;
    padding:7px 9px;resize:vertical;width:100%}
  textarea:focus,input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
  .revert{flex:none;font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);background:none;border:1px solid var(--rule);border-radius:2px;
    padding:5px 7px;cursor:pointer;margin-top:2px}
  .revert:hover{color:var(--pencil);border-color:var(--pencil)}
  .revert[hidden]{display:none}

  .status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--ink);color:var(--paper);padding:7px 15px;border-radius:2px;
    opacity:0;transition:opacity .18s;pointer-events:none}
  .status.on{opacity:1}
  .status.err{background:var(--pencil)}

  .note{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;color:var(--ink-2);
    border:1px solid var(--rule);border-left:3px solid var(--pencil);padding:10px 13px;
    margin:0 0 24px;background:var(--panel)}

  @media (max-width:820px){
    .cols{grid-template-columns:1fr;gap:0}
    nav{position:static;max-height:none;margin-bottom:22px}
    nav ol{display:flex;flex-wrap:wrap;gap:0 14px}
    nav a{border-bottom:none;padding:3px 0}
    .row{grid-template-columns:1fr;gap:5px}
    .lab{padding-top:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Ten Thousand Hours · copy desk</p>
    <h1>Scale Studies Editor</h1>
    <p class="sub">Every word on the site, in slide order. Edit a box and it saves for everyone —
      leave a box empty to fall back to what the site says now.</p>
    <div class="meter">
      <span>Fields <b id="m-total">0</b></span>
      <span>Edited <b id="m-edited">0</b></span>
      <span class="warn">Still blank <b id="m-blank">0</b></span>
      <span>Saving <b id="m-state">—</b></span>
    </div>
  </header>

  <div class="cols">
    <nav aria-label="Slides"><ol id="nav"></ol></nav>
    <main>
      <p class="note" id="note">Loading saved edits…</p>
      <div id="body"></div>
    </main>
  </div>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>

ph.kicker":"Plate III: the whole argument","graph.title":"The gap is not the hours. *It is the feedback.*","graph.axisX":"Hours invested","graph.axisY":"Actual skill","graph.curves.0.label":"Uncoached","graph.curves.0.desc":"\"Nobody ever told him.\"","graph.curves.1.label":"Coached","graph.curves.1.desc":"\"Every week, someone did.\"","graph.markers.0.label":"Tyler","graph.markers.0.note":"2,500 hrs · flat","graph.markers.1.label":"Cole","graph.markers.1.note":"4,200 hrs · still climbing","graph.projection.label":"Tyler at 10,000 hrs","graph.projection.note":"Same place.","graph.foot":"The issue isn't the amount of hours, it's the quality of those hours.","gated.kicker":"Outliers: the part nobody quotes","gated.title":"Every one of those answers has a price. Here is Cole’s.","gated.body":"Gladwell's true message was never about effort. Every outlier in his book was positioned somewhere that allowed them the privilege of a efficient feedback loop. They knew what direction was the best use of their time. Feedback is not free, nor handed evenly.","gated.gates.0.q":"A beginner flute?","gated.gates.0.cost":"$800","gated.gates.1.q":"One whose headjoint is shaped to your mouth?","gated.gates.1.cost":"$10,000","gated.gates.2.q":"A piccolo, if you want the harder instrument?","gated.gates.2.cost":"$13,000","gated.gates.3.q":"A teacher, once a week, for seven years?","gated.gates.3.cost":"≈$16,800","gated.gates.4.q":"A school with a music program at all?","gated.gates.4.cost":"Depends on the district","gated.gates.5.q":"A band director who replaces what broke?","gated.gates.5.cost":"Unbuyable","gated.examples.0.who":"Bill Gates","gated.examples.0.what":"Lakeside, 1968: a terminal that answered instantly, while everyone else waited days for punch cards to come back","gated.examples.1.who":"The Beatles","gated.examples.1.what":"Hamburg, 1960 to 1962: 270 nights, five or more hours a night, a live audience reacting to every song","gated.examples.2.who":"Cole","gated.examples.2.what":"“my school was broke so we had band.” Orchestra has strings, band does not","gated.punch":"Maybe its not that he outliers out-willed everyone. *Maybe they were all standing closer to the answer.*","spiral.kicker":"What it sounds like with nobody to ask","spiral.title":"With no coach, you have to become one ","spiral.sub":"This is the mindset you *need* to have to constantly improve.","spiral.questions.0":"Which strategies actually work?","spiral.questions.1":"Which ones only look like they work?","spiral.questions.2":"What are the optimal peek angles?","spiral.questions.3":"Which movement tech makes me harder to hit?","spiral.questions.4":"Am I holding the wrong angles on defense?","spiral.questions.5":"Is my sensitivity costing me flicks?","spiral.questions.6":"Is my mouse polling rate too low?","spiral.questions.7":"Is my monitor adding input lag?","spiral.questions.8":"What temperature should my room be to lock in?","spiral.questions.9":"Am I playing worse after 9pm?","spiral.questions.10":"How far am I from the nearest server?","spiral.questions.11":"Should I move house for better ping?","spiral.beat":"The peak of mastery isn't surmounted by *\"normal methods.\"*","mindset.kicker":"Section 2: LinkedIn Learning, “Developing Leadership Mindsets”","mindset.strike":"Feedback is something you survive.","mindset.replace":"Feedback is the *input*.","mindset.body":"If hours only count when someone’s correcting you, then the best habit a leader can build is asking to be corrected: early and often, before it’s comfortable.","mindset.kicker2":"We can always pretend to have answers. The question, however, would be, how would we then find constructive criticism that can support our growth?","mindset-turn.lines.0":"Asking to be corrected","mindset-turn.lines.1":"changes your own slope.","mindset-turn.accentLines.0":"Giving it","mindset-turn.accentLines.1":"changes everybody else’s.","mindset-turn.small":"That second one is most of what a leader is actually for.","food-gates.kicker":"Section 3: Power of Food. Same argument","food-gates.title":"Every gate has a name. None of them are willpower.","food-gates.body":"Nobody eats badly because they lack willpower, any more than Tyler lacked hours. Eating well is a skill, and skills need somebody who already knows how. Take that person away and you get the same flat line. People are trying. Nothing is telling them what would work.","food-gates.gates.0.q":"A grocery store nearby?","food-gates.gates.0.cost":"Miles, not minutes","food-gates.gates.1.q":"Time to cook after two jobs?","food-gates.gates.1.cost":"Rarely any","food-gates.gates.2.q":"Money for the version that is not packaged?","food-gates.gates.2.cost":"Priced like a luxury","food-gates.gates.3.q":"A kitchen that actually works?","food-gates.gates.3.cost":"Not guaranteed","food-gates.gates.4.q":"Someone who already knows how to cook it?","food-gates.gates.4.cost":"Depends who raised you","food-gates.gates.5.q":"A ride to get there at all?","food-gates.gates.5.cost":"Not everyone has one","food-gates.examples.0.who":"A ride","food-gates.examples.0.what":"A community shuttle on pantry days: the gate that costs least to open","food-gates.examples.1.who":"A recipe","food-gates.examples.1.what":"A thirty-minute card that assumes two jobs and one pan","food-gates.examples.2.who":"A person","food-gates.examples.2.what":"Somebody who stands there and shows you once. That’s the band director.","food-gates.punch":"Leadership here isn’t telling people to try harder. *It’s being the feedback they never got.*","food-actions.kicker":"Section 3 — the doing half","food-actions.title":"Three gates we could actually open this semester.","food-actions.body":"None of these teach anybody to cook. They put somebody next to the person who is already trying, which is the only thing that ever moved either of our two curves.","food-actions.gates.0.q":"A ride on pantry days","food-actions.gates.0.cost":"A driver, two hours","food-actions.gates.1.q":"A card that assumes two jobs and one pan","food-actions.gates.1.cost":"One afternoon","food-actions.gates.2.q":"Somebody who stands there and shows you once","food-actions.gates.2.cost":"An hour, and knowing how","food-actions.gates.3.q":"Doing it again next month","food-actions.gates.3.cost":"The hard part","food-actions.examples.0.who":"Cole","food-actions.examples.0.what":"had somebody in the room correcting her every week for seven years","food-actions.examples.1.who":"Tyler","food-actions.examples.1.what":"has two and a half thousand hours and nobody","food-actions.punch":"We cannot buy anyone ten thousand hours. *We can be the person in the room.*","piccolo.kicker":"What the list cannot price","piccolo.lead":"Her piccolo broke at a football game. It was the school’s, and it was $13,000.","piccolo.quote":"it just SNAPPED on me bc the wood was old and probably rotted… i was sobbing so bad LMFAOO… so my band director secretly bought a new one so i wouldn’t freak out","piccolo.attribution":"Cole","brand-statement.kicker":"Section 4: professional brand statement","brand-statement.lead":"So here’s the statement we’re staking our name to.","brand-statement.quote":"We don’t count hours. We build the loops that make hours count: asking to be corrected before it’s comfortable, and being that correction for the people around us. Nobody gets good alone, and we’d rather fewer people had to try.","brand-statement.attribution":"Collin, Bryan, Bonga, Eduard, and Cole","eduard-linkedin.kicker":"The brand, already running","eduard-linkedin.name":"Eduard Varga","eduard-linkedin.role":"Honors Finance Student, UNF","eduard-linkedin.photoCaption":"linkedin.com/in/eduardvarga","eduard-linkedin.facts.0.k":"School","eduard-linkedin.facts.0.v":"UNF, Coggin Honors","eduard-linkedin.facts.1.k":"Major","eduard-linkedin.facts.1.v":"Finance","eduard-linkedin.facts.2.k":"Matches reffed","eduard-linkedin.facts.2.v":"200+","eduard-linkedin.facts.3.k":"New hires trained","eduard-linkedin.facts.3.v":"Every one at the shop","eduard-linkedin.note":"Two hundred matches a year is two hundred rooms full of people telling you instantly when you were wrong. Then he turns around and trains the new hires, which is the same loop pointed at somebody else.","cole-takeaway.kicker":"Back to Cole","cole-takeaway.lead":"We asked her what seven years actually looked like.","cole-takeaway.quote":"after school (3pm), i’d do some hw, practice and warm up until practice starts (5:30pm) and it usually goes to like (8:30)… then i’d practice for like another 2 hours LMFAO… and for fridays for football/marching band, i was at school until 11 pm","cole-takeaway.attribution":"Cole","close.lines.0":"Ten thousand hours","close.lines.1":"will not teach you anything.","close.accent":"Ten thousand corrections will."}}
const { groups, defaults } = DATA
const $ = s => document.querySelector(s)
const edits = Object.create(null)          // path -> saved override
let db = null, saving = 0

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))
const flash = (msg, err) => { const el = $('#status'); el.textContent = msg
  el.className = 'status on' + (err ? ' err' : ''); clearTimeout(flash.t)
  flash.t = setTimeout(() => el.className = 'status', 1600) }

/* ── render the whole form from the schema, at rest, before any network ── */
$('#nav').innerHTML = groups.map(g => {
  const blanks = g.fields.filter(f => f.todo).length
  return `<li><a href="#g-${g.id}" class="${blanks ? 'has-blank' : ''}">
    <span>${esc(g.label)}</span><span class="n">${blanks ? blanks + '!' : g.fields.length}</span></a></li>`
}).join('')

$('#body').innerHTML = groups.map(g => `
  <section id="g-${g.id}">
    <div class="sh"><h2>${esc(g.label)}</h2><span class="id">${esc(g.id)}</span></div>
    ${g.fields.map(f => {
      const val = defaults[f.path] ?? ''
      const long = f.long || val.length > 90
      return `<div class="row ${f.todo ? 'blank' : ''}" data-row="${esc(f.path)}">
        <div class="lab">
          <span class="t">${esc(f.label)}</span>
          <span class="p">${esc(f.path)}</span>
          ${f.todo ? `<span class="todo">needs: ${esc(f.todo)}</span>` : ''}
        </div>
        <div class="fieldwrap">
          ${long
            ? `<textarea id="f-${esc(f.key)}" data-path="${esc(f.path)}" rows="${Math.min(7, Math.ceil(val.length / 78) + 1)}"
                 placeholder="${f.todo ? esc(f.todo) : ''}">${esc(val)}</textarea>`
            : `<input type="text" id="f-${esc(f.key)}" data-path="${esc(f.path)}"
                 placeholder="${f.todo ? esc(f.todo) : ''}" value="${esc(val)}">`}
          <button class="revert" type="button" hidden>Revert</button>
        </div>
      </div>`
    }).join('')}
  </section>`).join('')

$('#m-total').textContent = groups.reduce((a, g) => a + g.fields.length, 0)
const countBlank = () => $('#m-blank').textContent =
  [...document.querySelectorAll('[data-path]')].filter(el => !el.value.trim()).length
const countEdited = () => $('#m-edited').textContent = Object.keys(edits).length
countBlank(); countEdited()

/* ── persistence: the database holds only what differs from the site ── */
const groupOf = path => groups.find(g => g.fields.some(f => f.path === path))
const keyOf = path => path.replace(/\./g, '__')

const paint = (path, saved) => {
  const row = document.querySelector(`[data-row="${CSS.escape(path)}"]`)
  if (!row) return
  row.classList.toggle('dirty', saved)
  row.querySelector('.revert').hidden = !saved
}

async function save (path, value) {
  if (!db) return
  const g = groupOf(path); if (!g) return
  const same = value === (defaults[path] ?? '')
  saving++; $('#m-state').textContent = 'yes'
  const ref = db.doc('copy/' + g.id)
  const patch = { [keyOf(path)]: same ? '' : value }
  try {
    try {
      await ref.update(patch)
    } catch (e) {
      // update() cannot create a document, so the first write to a slide
      // that has no document yet fails. set() creates it, and every later
      // write merges as normal.
      if (e.code !== 'invalid_argument') throw e
      await ref.set(patch)
    }
    if (same) { delete edits[path]; paint(path, false) } else { edits[path] = value; paint(path, true) }
    countEdited(); flash('Saved')
  } catch (e) {
    flash(e.code === 'not_granted' ? 'No permission to save' : 'Could not save — ' + (e.code || 'error'), true)
  } finally { if (--saving === 0) $('#m-state').textContent = '—' }
}

let timer
document.addEventListener('input', e => {
  const el = e.target.closest('[data-path]'); if (!el) return
  countBlank()
  clearTimeout(timer); timer = setTimeout(() => save(el.dataset.path, el.value), 700)
})
document.addEventListener('change', e => {
  const el = e.target.closest('[data-path]'); if (!el) return
  clearTimeout(timer); save(el.dataset.path, el.value)
})
document.addEventListener('click', e => {
  const btn = e.target.closest('.revert'); if (!btn) return
  const el = btn.closest('.fieldwrap').querySelector('[data-path]')
  el.value = defaults[el.dataset.path] ?? ''
  countBlank(); save(el.dataset.path, el.value)
})

/* ── live: other people's edits land without a reload ── */
;(async () => {
  // served outside the viewer there is no window.claude at all
  db = await window.claude?.use?.('db')
  if (!db) {
    $('#note').textContent = 'Read-only here — saving is not available in this view. ' +
      'Open the editor from the link Claude shared to make changes.'
    return
  }
  $('#note').innerHTML = 'Edits save automatically and everyone sees them. ' +
    'When you are done, tell Claude <b>“pull the copy”</b> and it goes onto the site.'
  for (const g of groups) {
    db.doc('copy/' + g.id).onSnapshot(snap => {
      const data = snap.exists ? snap.data() : {}
      for (const f of g.fields) {
        const v = data[keyOf(f.path)]
        const el = document.getElementById('f-' + f.key)
        if (!el) continue
        if (v == null || v === '') { if (edits[f.path]) { delete edits[f.path]; paint(f.path, false) }; continue }
        edits[f.path] = v
        paint(f.path, true)
        if (document.activeElement !== el && el.value !== v) el.value = v   // never fight a typist
      }
      countEdited(); countBlank()
    }, err => flash('Live sync stopped — ' + (err.code || 'error'), true))
  }
})()
</script>
