<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap">
  <style>
    body { margin: 0; font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #cdf24d; } a:hover { color: #e2ff8a; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #0a0a0c; color: #f4f1ea; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #cdf24d;"></div>

  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; gap: 80px; padding: 0 100px;">

    <div style="display: flex; flex-direction: column; gap: 20px;">
      <span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a877f;">Chapter</span>
      <div style="display: flex; align-items: baseline; gap: 34px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 300px; line-height: 0.72; color: #cdf24d;">I</span>
        <span style="font-size: 92px; font-weight: 500; letter-spacing: -0.045em;">Master</span>
      </div>
      <p style="margin: 0; font-size: 21px; color: #8a877f; max-width: 30ch; line-height: 1.5;">A person who actually did the hours.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0; border-left: 1px solid #26252b; padding-left: 44px;">
      <div style="display: flex; align-items: baseline; gap: 20px; padding: 18px 0; border-bottom: 1px solid #1c1b21;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; color: #cdf24d; width: 52px;">I</span>
        <span style="font-size: 24px;">Master</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 20px; padding: 18px 0; border-bottom: 1px solid #1c1b21; opacity: 0.34;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; width: 52px;">II</span>
        <span style="font-size: 24px;">The Number</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 20px; padding: 18px 0; border-bottom: 1px solid #1c1b21; opacity: 0.34;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; width: 52px;">III</span>
        <span style="font-size: 24px;">The Separator</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 20px; padding: 18px 0; opacity: 0.34;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; width: 52px;">IV</span>
        <span style="font-size: 24px;">The Content</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
