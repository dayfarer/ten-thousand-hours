<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #1f3d2b; } a:hover { color: #7a3b2e; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #f6f2e9; color: #1b1815; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: 470px minmax(0, 1fr); gap: 96px; align-items: center; padding: 0 96px;">

    <div style="width: 100%; height: 640px; background: #efeae0; border: 1px solid #d8d0c2; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="position: absolute; inset: 13px; border: 1px solid #e5decf;"></div>
      <svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#c2b8a4" stroke-width="0.9" stroke-linecap="round">
        <rect x="3" y="5" width="18" height="14"></rect>
        <circle cx="8.5" cy="10.5" r="1.6"></circle>
        <path d="M21 15l-5.5-5.5L5 19"></path>
      </svg>
      <span style="position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #a89e8c;">Photograph of Cole</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 38px;">
      <span style="font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: #7a3b2e;">Exhibit the First</span>

      <div style="display: flex; align-items: baseline; gap: 26px;">
        <h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 160px; line-height: 0.84; font-weight: 400; letter-spacing: -0.003em;">Cole</h1>
        <span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-style: italic; font-size: 43px; color: #6e675c;">flute</span>
      </div>

      <div style="display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 17px 0; border-top: 1px solid #1b1815;">
          <span style="font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: #6e675c;">Began</span>
          <span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px;">[age]</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 17px 0; border-top: 1px solid #d8d0c2;">
          <span style="font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: #6e675c;">Years elapsed</span>
          <span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px;">[yrs]</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 17px 0; border-top: 1px solid #d8d0c2; border-bottom: 1px solid #d8d0c2;">
          <span style="font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: #6e675c;">Hours, estimated</span>
          <span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; color: #1f3d2b;">[hrs]</span>
        </div>
      </div>

      <p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-style: italic; font-size: 35px; line-height: 1.44; color: #1b1815; max-width: 25ch;">
        She did not set out to do ten thousand hours. Nobody does. They simply keep showing up.
      </p>
    </div>

  </div>

  <div style="position: absolute; inset: 0; pointer-events: none; z-index: 40; background: radial-gradient(115% 88% at 50% 38%, rgba(246,242,233,0) 44%, rgba(122,105,78,0.14) 100%);"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; z-index: 41; background-image: url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27180%27%20height=%27180%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.8%27%20numOctaves=%274%27%20stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url%28%23n%29%27/%3E%3C/svg%3E); mix-blend-mode: soft-light; opacity: 0.68;"></div>
</div>
</x-dc>
</body>
</html>
